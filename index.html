<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arc Token Explorer — Live Dashboard</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050510;--card:rgba(13,13,26,0.85);--border:rgba(26,26,46,0.8);--text:#e8e8f0;--muted:#666;--accent:#667eea;--accent2:#764ba2;--green:#4ade80;--red:#f87171;--purple:#c084fc;--gold:#fbbf24;--orange:#fb923c}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}

/* Header */
.header{background:linear-gradient(135deg,rgba(13,13,26,0.95),rgba(26,10,46,0.95));border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;backdrop-filter:blur(20px);position:sticky;top:0;z-index:50}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 18px rgba(102,126,234,0.4)}
.logo h1{font-size:18px;font-weight:800;color:#fff;letter-spacing:-0.5px}
.logo span{font-size:10px;color:var(--muted)}
.header-right{display:flex;align-items:center;gap:12px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;box-shadow:0 0 8px var(--green)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}}
.status{font-size:11px;color:var(--muted)}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;box-shadow:0 3px 12px rgba(102,126,234,0.3)}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(102,126,234,0.4)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-danger{background:linear-gradient(135deg,#dc2626,#991b1b)}

/* Alert banner */
.alert-banner{background:linear-gradient(90deg,rgba(248,113,113,0.15),rgba(251,146,60,0.15));border-bottom:1px solid rgba(248,113,113,0.3);padding:10px 20px;display:none;align-items:center;gap:12px;overflow:hidden}
.alert-banner.show{display:flex}
.alert-dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:pulse 1s infinite;flex-shrink:0}
.alert-text{font-size:13px;color:#fecaca;white-space:nowrap;animation:scroll-left 15s linear infinite}
@keyframes scroll-left{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}

/* Main layout */
.main{max-width:1400px;margin:0 auto;padding:16px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;backdrop-filter:blur(10px);transition:all .2s}
.stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat-l{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:4px}
.stat-v{font-size:18px;font-weight:800;color:#fff}
.stat-sub{font-size:10px;margin-top:2px}
.up{color:var(--green)}.down{color:var(--red)}

/* Tabs */
.tabs{display:flex;gap:3px;margin-bottom:16px;border-bottom:1px solid var(--border);overflow-x:auto;padding-bottom:0}
.tab{padding:10px 16px;cursor:pointer;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;font-weight:500;position:relative}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-badge{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;font-size:9px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.flex-col{display:flex;flex-direction:column;gap:12px}

/* Card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;backdrop-filter:blur(10px);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:opacity .2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 30px rgba(102,126,234,0.15)}
.card:hover::before{opacity:1}
.card-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.card-img{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;flex-shrink:0;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-info{flex:1;min-width:0}
.card-name{font-weight:800;font-size:15px;color:#fff}
.card-desc{font-size:10px;color:var(--muted);margin-top:1px}
.badge-new{font-size:8px;padding:2px 6px;border-radius:4px;font-weight:700;background:rgba(74,222,128,0.2);color:var(--green)}
.badge-known{font-size:8px;padding:2px 6px;border-radius:4px;font-weight:700;background:rgba(102,126,234,0.2);color:var(--accent)}
.card-price{font-size:22px;font-weight:800;color:#fff}
.card-chg{font-size:13px;font-weight:700}
.card-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.meta{font-size:10px}.meta-l{color:var(--muted)}.meta-v{color:var(--text);font-weight:600}

/* Alert card */
.alert-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;border-left:3px solid var(--accent);animation:fadeIn .3s}
.alert-card.new_token{border-left-color:var(--green)}
.alert-card.price_crash{border-left-color:var(--red)}
.alert-card.price_pump{border-left-color:var(--orange)}
.alert-card.whale_buy{border-left-color:var(--green)}
.alert-card.whale_sell{border-left-color:var(--red)}
.alert-card.test{border-left-color:var(--purple)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.alert-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.alert-type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:4px}
.at-new_token{background:rgba(74,222,128,0.2);color:var(--green)}
.at-price_crash{background:rgba(248,113,113,0.2);color:var(--red)}
.at-price_pump{background:rgba(251,146,60,0.2);color:var(--orange)}
.at-whale_buy{background:rgba(74,222,128,0.2);color:var(--green)}
.at-whale_sell{background:rgba(248,113,113,0.2);color:var(--red)}
.at-test{background:rgba(192,132,252,0.2);color:var(--purple)}
.alert-time{font-size:10px;color:var(--muted)}
.alert-msg{font-size:13px;color:var(--text);line-height:1.4}

/* New token feed */
.new-feed{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.new-feed h3{color:#fff;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.new-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.new-item:last-child{border-bottom:none}
.new-sym{font-weight:700;color:#fff;min-width:80px}
.new-price{font-size:13px;color:var(--text)}
.new-mcap{font-size:11px;color:var(--muted);margin-left:auto}

/* Settings panel */
.settings-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.settings-panel h3{color:#fff;font-size:14px;margin-bottom:14px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);gap:12px}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:12px;color:var(--text)}
.setting-desc{font-size:10px;color:var(--muted);margin-top:2px}
.setting-input{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text);font-size:13px;width:80px;text-align:center;outline:none}
.setting-input:focus{border-color:var(--accent)}
.toggle{position:relative;width:40px;height:22px;background:var(--border);border-radius:11px;cursor:pointer;transition:background .2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on::after{transform:translateX(18px)}

/* Chart modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px)}
.modal-overlay.open{display:flex}
.modal{background:linear-gradient(180deg,#0d0d1a,#0a0a15);border:1px solid var(--border);border-radius:18px;width:100%;max-width:760px;max-height:90vh;overflow-y:auto}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:18px;font-weight:800;color:#fff}
.modal-close{background:var(--border);border:none;color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px}
.modal-body{padding:20px}
.chart-box{width:100%;height:260px;border-radius:10px;overflow:hidden;margin-bottom:16px;background:#0a0a15;border:1px solid #1a1a2e}
.modal-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.mstat{background:rgba(0,0,0,0.3);border-radius:8px;padding:10px}
.mstat-l{font-size:9px;color:var(--muted);text-transform:uppercase}
.mstat-v{font-size:15px;font-weight:700;color:#fff;margin-top:3px}
.modal-links{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.mbtn{padding:9px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-secondary{background:var(--border);color:var(--text);border:1px solid #2a2a4a}

/* Search */
.search-bar{display:flex;gap:8px;margin-bottom:14px}
.search-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 14px;color:var(--text);font-size:13px;outline:none}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}

/* Loading */
.loading{text-align:center;padding:36px;color:var(--muted);font-size:13px}

.tab-content{display:none}
.tab-content.active{display:block}

.footer{margin-top:32px;padding:16px;text-align:center;color:var(--muted);font-size:10px;border-top:1px solid var(--border)}
.footer a{color:var(--accent)}

/* Mobile */
@media(max-width:640px){
  .header{padding:10px 14px}
  .logo h1{font-size:16px}
  .main{padding:12px}
  .stats{grid-template-columns:repeat(3,1fr);gap:6px}
  .stat{padding:10px 8px}
  .stat-v{font-size:15px}
  .grid{grid-template-columns:1fr}
  .tabs{gap:0}
  .tab{padding:8px 12px;font-size:11px}
  .modal{max-height:95vh;border-radius:14px}
  .chart-box{height:200px}
}
</style>
</head>
<body>

let allData = [];
let filteredData = [];
let charts = {};
let alertCount = 0;
let newAlerts = [];
let discoveryInfo = {};
const BASE = window.location.origin;
const KNOWN_ADDRS = new Set([

// ── API ──
async function api(path, opts={}) {
  const r = await fetch(BASE + path, {headers:{"User-Agent":"ArcExplorer/1.0"},...opts});
  return r.json();
}

async function fetchGecko(addr) {
  try {
    const r = await fetch(`https://api.geckoterminal.com/api/v2/networks/arc/tokens/${addr}`, {headers:{"User-Agent":"ArcExplorer/1.0"}});
    if (!r.ok) return null;
    const j = await r.json();
    const a = j.data?.attributes || {};
    return {price:parseFloat(a.price_usd||0)||null, mcap:parseFloat(a.market_cap_usd||0)||null, fdv:parseFloat(a.fdv_usd||0)||null, vol24:parseFloat(a.volume_usd?.h24||0)||null, chg24:parseFloat(a.price_change_percentage?.h24||0)||null, chg7d:parseFloat(a.price_change_percentage?.d7||0)||null, name:a.name||''};
  } catch { return null; }
}

async function fetchDex(addr) {
  try {
    const r = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${addr}`, {headers:{"User-Agent":"Mozilla/5.0"}});
    if (!r.ok) return null;
    const j = await r.json();
    const arc = (j.pairs||[]).filter(p=>p.chainId==='arc').sort((a,b)=>-(b.liquidity?.usd||0)-(a.liquidity?.usd||0))[0];
    if (!arc) return null;
    return {buys24:arc.txns?.h24?.buys||0, sells24:arc.txns?.h24?.sells||0, liq:arc.liquidity?.usd||0, vol:arc.volume?.h24||0, chg24:arc.priceChange?.h24||0, chg6h:arc.priceChange?.h6||0, chg1h:arc.priceChange?.h1||0, url:arc.url||'', created:arc.pairCreatedAt||0, price:parseFloat(arc.priceUsd||0)||null, mcap:parseFloat(arc.marketCap||0)||null, fdv:parseFloat(arc.fdv||0)||null};
  } catch { return null; }
}

async function fetchLlamaPrices(addresses) {
  const ids = addresses.map(a=>`arc:${a}`).join(',');
  try {
    const r = await fetch(`https://coins.llama.fi/prices/current/${ids}`, {headers:{"User-Agent":"ArcExplorer/1.0"}});
    if (!r.ok) return {};
    const d = await r.json();
    const result = {};
    for (const [k,v] of Object.entries(d.coins||{})) result[k.split(':')[1]?.toLowerCase()||''] = v.price;
    return result;
  } catch { return {}; }
}

async function fetchLlamaHistory(address, points=48) {
  const now = Math.floor(Date.now()/1000);
  const interval = Math.floor(24*3600/Math.min(points, 24));
  const series = [];
  for (let i=points-1; i>=0; i--) {
    const ts = now - i*interval;
    try {
      const r = await fetch(`https://coins.llama.fi/prices/historical/${ts}/arc:${address}`, {headers:{"User-Agent":"ArcExplorer/1.0"}});
      if (r.ok) {
        const d = await r.json();
        const p = d.coins?.[`arc:${address}`]?.price;
        if (p) series.push({time: ts, value: p});
      }
    } catch {}
  }
  return series;
}

// ── Refresh ──
async function refreshAll() {
  document.getElementById('status').textContent = 'Updating…';

  // Fetch token data
  const results = await Promise.all(TOKEN_DEFS.map(async t => {
    const [g, d] = await Promise.all([fetchGecko(t.addr), fetchDex(t.addr)]);
    return {...t, gecko:g, dex:d, isKnown:KNOWN_ADDRS.has(t.addr.toLowerCase())};
  }));

  // Batch fetch images from GeckoTerminal
  const addrs = results.map(r=>r.addr.toLowerCase());
  const llama = await fetchLlamaPrices(addrs);
  
  // Fetch token images in parallel
  const imagePromises = addrs.map(async (addr) => {
    try {
      const r = await fetch(`https://api.geckoterminal.com/api/v2/networks/arc/tokens/${addr}`, {headers:{"User-Agent":"ArcExplorer/1.0"}});
      if (!r.ok) return {addr, img: null};
      const d = await r.json();
      const img = d.data?.attributes?.image_url || null;
      return {addr, img};
    } catch { return {addr, img: null}; }
  });
  const imageResults = await Promise.all(imagePromises);
  const imgMap = Object.fromEntries(imageResults.map(r => [r.addr, r.img]));

  allData = results.filter(r=>(r.dex||r.gecko) && r.addr).map(r => {
    const price = llama[r.addr.toLowerCase()] || r.gecko?.price || r.dex?.price;
    return {...r, price, mcap:r.gecko?.mcap||r.dex?.mcap, fdv:r.gecko?.fdv||r.dex?.fdv, vol:r.gecko?.vol24||r.dex?.vol, chg:r.gecko?.chg24??r.dex?.chg24, chg7d:r.gecko?.chg7d, img:imgMap[r.addr.toLowerCase()] || r.dex?.info?.imageUrl || null};
  }).sort((a,b)=>(b.mcap||0)-(a.mcap||0));
  
  // Also load discovered tokens from API that aren't in TOKEN_DEFS
  try {
    const disc = await api('/api/tokens');
    const knownSyms = new Set(allData.map(t=>t.sym.toUpperCase()));
    for (const t of disc) {
      const sym = (t.symbol||'').toUpperCase();
      if (!knownSyms.has(sym) && t.address && t.price > 0 && (t.mcap||0) > 1000) {
        allData.push({sym, desc:t.name||sym, addr:t.address.toLowerCase(), price:t.price, mcap:t.mcap||0, fdv:t.fdv||0, vol:t.vol_24h||0, chg:t.chg_24h||0, chg7d:null, isKnown:false, dex:{}, gecko:{}});
      }
    }
    allData.sort((a,b)=>(b.mcap||0)-(a.mcap||0));
  } catch {}

  filteredData = [...allData];
  updateDiscovery();
  renderAll();
  document.getElementById('status').textContent = `Updated ${new Date().toLocaleTimeString()}`;
}

async function renderRealChart(t) {
  if (typeof LightweightCharts === 'undefined') {
    console.error('LightweightCharts not loaded!');
    const box = document.getElementById('chart-box');
    if (box) {
      box.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:260px;color:#f87171;font-size:13px">Chart library not loaded</div>';
    }
    return;
  }
  console.log('renderRealChart called', t.sym, 'addr=' + t.addr, 'price=' + t.price);
  const box = document.getElementById('chart-box');
  console.log('box element:', box, 'clientWidth=', box.clientWidth, 'clientHeight=', box.clientHeight);
  box.innerHTML = '';

  if (charts[t.addr]) { charts[t.addr].remove(); delete charts[t.addr]; }

  // Dynamic precision based on price
  const price = t.price || 0.001;
  let precision = 2;
  if (price < 0.01) precision = 6;
  if (price < 0.001) precision = 8;
  if (price < 0.0001) precision = 10;
  const minMove = Math.pow(10, -precision);

  // Ensure container has size before creating chart
  if (box.clientWidth === 0) box.style.width = '100%';
  const chartW = box.clientWidth || 700;
  console.log('Creating chart, box size:', box.clientWidth, 'x', box.clientHeight);
  if (!box || box.clientWidth === 0) {
    console.error('Chart box not ready');
    const err = document.createElement('div');
    err.style.cssText = 'display:flex;align-items:center;justify-content:center;height:260px;color:#f87171;font-size:13px';
    err.textContent = 'Chart unavailable - try refreshing';
    box.appendChild(err);
    return;
  }
  const chart = LightweightCharts.createChart(box, {
    layout: { background: { color: '#0a0a15' }, textColor: '#555', fontSize: 11 },
    grid: { vertLines: { color: '#1a1a2e' }, horzLines: { color: '#1a1a2e' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightAxis: { borderColor: '#1a1a2e', tickAlign: 'left', priceFormat: { type: 'price', precision, minMove } },
    leftAxis: { visible: true, borderColor: '#1a1a2e' },
    timeScale: { borderColor: '#1a1a2e', timeVisible: true, secondsVisible: false, rightOffset: 2 },
    width: chartW, height: 260
  });

  const isUp = (t.chg || 0) >= 0;
  const lineColor = isUp ? '#4ade80' : '#f87171';

  const line = chart.addLineSeries({
    color: lineColor,
    lineWidth: 2,
    priceFormat: { type: 'price', precision, minMove },
    priceLine: { labeled: true, labelBackgroundColor: lineColor },
    lastValueLabel: { visible: true, labelBackgroundColor: lineColor },
    priceScaleId: 'right',
  });

  // Volume histogram
  const volColor = isUp ? 'rgba(74,222,128,0.15)' : 'rgba(248,113,113,0.15)';
  const volBorder = isUp ? 'rgba(74,222,128,0.4)' : 'rgba(248,113,113,0.4)';
  const volSeries = chart.addHistogramSeries({
    color: volColor,
    priceFormat: { type: 'volume' },
    priceLine: { visible: false },
    lastValueLabel: { visible: false },
    priceScaleId: 'left',
  });

  // Primary: fetch local accumulated history (most reliable)
  let history = await fetchLocalHistory(t.addr);

  if (history.length < 3) {
    // Try Llama live fetch as fallback
    const llama = await fetchLlamaHistory(t.addr, 24);
    if (llama.length >= 3) history = llama;
  }

  console.log('History points:', history.length, 'first:', history[0], 'last:', history[-1]);

  if (history.length >= 3) {
    try {
      line.setData(history);
    } catch(e) {
      console.error('setData error:', e);
      const err = document.createElement('div');
      err.style.cssText = 'display:flex;align-items:center;justify-content:center;height:260px;color:#f87171;font-size:13px';
      err.textContent = 'Error loading chart data';
      box.appendChild(err);
      return;
    }
    console.log('Data set successfully');

    // Volume bars from price changes
    const volData = [];
    for (let i = 1; i < history.length; i++) {
      const chg = history[i].value - history[i-1].value;
      // Scale volume to fit nicely in left axis (0-100 range)
      const volVal = Math.min(100, Math.max(1, Math.abs(chg) / price * 100));
      volData.push({
        time: history[i].time,
        value: volVal,
        color: chg >= 0 ? 'rgba(74,222,128,0.25)' : 'rgba(248,113,113,0.25)',
      });
    }
    if (volData.length) volSeries.setData(volData);
    // Show point count
    const ptsEl = document.createElement('div');
    ptsEl.style.cssText = 'position:absolute;top:8px;left:8px;font-size:10px;color:#555;background:rgba(0,0,0,0.5);padding:2px 6px;border-radius:4px;z-index:10';
    ptsEl.textContent = history.length + ' points';
    box.appendChild(ptsEl);
  } else {
    // No real data yet — show message, not fake chart
    const msg = document.createElement('div');
    msg.style.cssText = 'display:flex;align-items:center;justify-content:center;height:260px;color:#555;font-size:13px;text-align:center;flex-direction:column;gap:8px';
    msg.innerHTML = '<div style="font-size:24px">⏳</div><div>Accumulating price history...</div><div style="font-size:11px">Will show real data once we have 3+ readings</div>';
    box.appendChild(msg);
  }

  chart.timeScale().fitContent();
  charts[t.addr] = chart;
  
  // Handle resize
  const ro = new ResizeObserver(() => {
    if (charts[t.addr]) {
      charts[t.addr].applyOptions({ width: box.clientWidth || 700 });
      chart.timeScale().fitContent();
    }
  });
  ro.observe(box);
  if (!t._ro) t._ro = ro;
}

// ── SSE ──
function connectSSE() {
  const es = new EventSource(BASE + '/api/stream');

  es.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (e.event === 'init') {
        window._initAlerts = data.alerts || 0;
        discoveryInfo = data.discovery || {};
        updateAlertBadge();
      } else if (e.event === 'scan') {
        if (data.new_alerts > 0) {
          newAlerts.unshift(...data.alerts);
          newAlerts = newAlerts.slice(0, 50);
          updateAlertBadge();
          showBanner(data.alerts[0]?.msg);
          if (document.getElementById('tab-alerts').classList.contains('active')) renderAlerts();
        }
        discoveryInfo = {...discoveryInfo, total:data.total, last_run:data.last_run};
        document.getElementById('status').textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } else if (e.event === 'alert') {
        if (data.type === 'test') showBanner('🧪 Test alert sent!');
      } else if (e.event === 'heartbeat') {
        // alive
      }
    } catch {}
  };

  es.onerror = () => {
    es.close();
    setTimeout(connectSSE, 5000);
  };
}

function updateAlertBadge() {
  const badge = document.getElementById('alert-badge');
  const count = (window._initAlerts || 0) + newAlerts.length;
  if (count > 0) {
    badge.style.display = 'flex';
    badge.textContent = count > 9 ? '9+' : count;
  } else {
    badge.style.display = 'none';
  }
}

  const banner = document.getElementById('alert-banner');
  const text = document.getElementById('alert-text');
  text.textContent = msg;
  banner.classList.add('show');
  setTimeout(()=>banner.classList.remove('show'), 6000);
}

    document.getElementById('status').textContent = `Scan done: ${r.total} tokens, ${r.alerts} alerts`;
    if (r.alerts > 0) {

  }
}

// ── Helpers ──
function fmt(v) {
  if (v==null) return '—';
  if (v>=1e9) return '$'+(v/1e9).toFixed(2)+'B';
  if (v>=1e6) return '$'+(v/1e6).toFixed(2)+'M';
  if (v>=1e3) return '$'+(v/1e3).toFixed(0)+'K';
  return '$'+v.toFixed(2);
}
function fmtPrice(p) {
  if (p==null) return '—';
  if (p===0) return '$0';
  if (p<0.0001) return '$'+p.toExponential(2);
  return '$'+p.toFixed(6);
}

// ── Init ──
Promise.all([refreshAll(), api('/api/settings').then(s=>window._settings=s), api('/api/alerts?limit=20').then(a=>window._savedAlerts=a)]).then(()=>{
  renderAll();
  connectSSE();
});
window.addEventListener('resize', ()=>{
  if (document.getElementById('modal').classList.contains('open') && currentAddr && charts[currentAddr]) {
    const t = allData.find(t=>t.addr.toLowerCase()===currentAddr);
    if (t) renderRealChart(t);
  }
});
// Auto-refresh every 60s
setInterval(refreshAll, 60000);
</script>
